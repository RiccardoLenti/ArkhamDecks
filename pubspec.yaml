name: arkham_decks
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
    
  sqflite: ^2.4.2
  sqflite_common_ffi: any
  path: ^1.9.1
  flutter_svg: ^2.0.9
  provider: ^6.1.5+1
  flutter_html: ^3.0.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/icons/
  - assets/db/app.db

  fonts: 
    - family: Cost 
      fonts:
        - asset: assets/fonts/cost.ttf
    - family: Arkhamic 
      fonts:
        - asset: assets/fonts/Arkhamic.ttf
    - family: Alegreya
      fonts: 
        - asset: assets/fonts/Alegreya-VariableFont_wght.ttf
        - asset: assets/fonts/Alegreya-Italic-VariableFont_wght.ttf